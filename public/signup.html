<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="top-header">
            <h1 class="logo"><a href="index.html">Menz</a></h1>
            <div class="search-and-icons">
                <div class="search-bar-container">
                    <input type="text" placeholder="검색" class="search-input">
                    <img src="search.svg" alt="검색 아이콘" class="search-icon-img">
                </div>
                <div class="user-icons">
                    <img src="cart.svg" alt="장바구니 아이콘">
                    <img src="mypage.svg" alt="마이페이지 아이콘">
                </div>
            </div>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="#">Best</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Outer</a></li>
                <li><a href="#">Top</a></li>
                <li><a href="#">Bottom</a></li>
                <li><a href="#">Shoes</a></li>
                <li><a href="#">Acc</a></li>
            </ul>
            <div class="auth-links">
                <a href="login.html">로그인</a>
                <a href="signup.html">회원가입</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="signup-container">
            <h2>회원가입</h2>
            <form action="#" method="POST" class="signup-form">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <div class="input-with-button">
                        <input type="text" id="username" placeholder="영문 소문자/숫자 포함 4-16자" required>
                        <button type="button" class="btn-check">중복</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="영문 소문자/숫자/특수문자 포함 4-16자" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">비밀번호 확인</label>
                    <input type="password" id="confirm-password" placeholder="영문 소문자/숫자/특수문자 포함 4-16자" required>
                </div>
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="address-si">주소</label>
                    <input type="text" id="address-si" placeholder="시/도" required>
                </div>
                <div class="form-group">
                    <input type="text" id="address-gu" placeholder="시/군/구" required>
                </div>
                <div class="form-group">
                    <input type="text" id="address-detail" placeholder="상세 주소" required>
                </div>
                <button type="submit" class="btn-signup">회원가입</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-text">
                <p>어디에서도 누구보다도 트렌디하게<br>당신의 스타일을 완성하다.</p>
                <p>Trendier than anyone, anywhere<br>perfect your style.</p>
            </div>
            <div class="footer-links">
                <p><a href="#"><img src="instargram.svg" alt="인스타그램 아이콘"></a> www.instargram.com</p>
                <p><a href="#"><img src="youtube.svg" alt="유튜브 아이콘"></a> www.youtube.com</p>
                <p><a href="#"><img src="mail.svg" alt="메일 아이콘"></a> mailmail@gmail.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>
                <a href="#">고객 지원</a> 
                <a href="#" class="btn-inquiry">1:1 문의하기</a> | 
                <a href="#">FAQ 자주 묻는 질문</a> | 
                <a href="#">정책 문의</a>
            </p>
        </div>
    </footer>
</body>
</html>
