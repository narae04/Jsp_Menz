<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <!-- 헤더 포함 -->
    <div id="header"></div>

    <!-- 메인 영역 -->
    <main>
        <section class="signup-container">
            <h2>회원가입</h2>
            <form action="#" method="POST" class="signup-form">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <div class="input-with-button">
                        <input type="text" id="username" placeholder="영문 소문자/숫자 포함 4-16자" required>
                        <button type="button" class="btn-check">중복</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="영문 소문자/숫자/특수문자 포함 4-16자" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">비밀번호 확인</label>
                    <input type="password" id="confirm-password" placeholder="영문 소문자/숫자/특수문자 포함 4-16자" required>
                </div>
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="address-si">주소</label>
                    <input type="text" id="address-si" placeholder="시/도" required>
                </div>
                <div class="form-group">
                    <input type="text" id="address-gu" placeholder="시/군/구" required>
                </div>
                <div class="form-group">
                    <input type="text" id="address-detail" placeholder="상세 주소" required>
                </div>
                <button type="submit" class="btn-signup">회원가입</button>
            </form>
        </section>
    </main>

    <!-- 푸터 포함 -->
    <div id="footer"></div>

    <script>
        // 헤더 불러오기
        fetch('header.html')
            .then(res => res.text())
            .then(html => document.getElementById('header').innerHTML = html);

        // 푸터 불러오기
        fetch('footer.html')
            .then(res => res.text())
            .then(html => document.getElementById('footer').innerHTML = html);
    </script>
</body>
</html>
